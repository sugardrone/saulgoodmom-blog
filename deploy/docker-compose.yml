services:
  blog:
    image: m.daocloud.io/docker.io/library/nginx:1.27-alpine
    container_name: blog
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '8880:8880'
      - '8081:8081'
    volumes:
      - /srv/blog:/usr/share/nginx/html:ro
      - /srv/blog-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/acme:/usr/share/nginx/acme:ro
      - /srv/certbot/conf:/etc/letsencrypt:ro

  oauth-gateway:
    build:
      context: ./oauth-gateway
    container_name: blog-oauth-gateway
    restart: unless-stopped
    env_file:
      - /srv/blog-nginx/oauth-gateway.env

  cloudflared:
    image: m.daocloud.io/docker.io/cloudflare/cloudflared:latest
    container_name: blog-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 --config /etc/cloudflared/config.yml run
    volumes:
      - /srv/blog-nginx/cloudflared:/etc/cloudflared:ro
    depends_on:
      - blog
