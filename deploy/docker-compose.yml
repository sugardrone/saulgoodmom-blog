services:
  blog:
    image: m.daocloud.io/docker.io/library/nginx:1.27-alpine
    container_name: blog
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '8081:8081'
    volumes:
      - /srv/blog:/usr/share/nginx/html:ro
      - /srv/blog-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /srv/acme:/usr/share/nginx/acme:ro
      - /srv/certbot/conf:/etc/letsencrypt:ro
