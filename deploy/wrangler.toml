name = "blog-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

# Worker 路由：接管 suncar.live 全部流量，反代到阿里云源站
# 前提：DNS 里 suncar.live / www.suncar.live 有指向源站的 A 记录且开启橙云代理
routes = [
  { pattern = "suncar.live/*", zone_name = "suncar.live" },
  { pattern = "www.suncar.live/*", zone_name = "suncar.live" },
]
