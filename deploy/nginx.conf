server {
    listen 80;
    listen 8880;
    listen 8081;
    server_name suncar.live www.suncar.live 121.41.26.131;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/acme;
        default_type text/plain;
    }

    location ^~ /oauth/ {
        proxy_pass http://oauth-gateway:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(woff2|svg|ico|png|jpg|jpeg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name suncar.live www.suncar.live;

    ssl_certificate /etc/letsencrypt/live/suncar.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suncar.live/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location ^~ /oauth/ {
        proxy_pass http://oauth-gateway:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(woff2|svg|ico|png|jpg|jpeg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
